[pytest]
testpaths = tests
addopts = -p no:cacheprovider
filterwarnings =
    # Starlette suggests a newer HTTP client for TestClient; harmless for these tests
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    # screen smoke test: Python may free an old screen's Tk image on a worker thread; harmless
    ignore:Exception ignored in. <function Image.__del__:pytest.PytestUnraisableExceptionWarning
